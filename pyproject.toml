[project]
name = "mathpocalypse"
version = "0.1.0"
description = "Using frontier open-weight LLMs (GLM-5.2) to detect errors in published math/TCS papers."
license = "MIT"
requires-python = ">=3.10"
# Deliberately minimal. The model-serving stack lives in the sibling `bigLLM-azzurra`
# project and runs on the cluster, not here. This package is the *harness*: it ingests
# papers, builds verification prompts, drives a model, and collects structured reports.
dependencies = [
    "pyyaml>=6.0",      # paper registry
    "requests>=2.31",   # arXiv / paper fetching
]

[project.optional-dependencies]
# Client used to talk to the served model (OpenAI-compatible endpoint).
client = [
    "openai>=1.0",
]
dev = [
    "ruff>=0.5",
]

[tool.uv]
